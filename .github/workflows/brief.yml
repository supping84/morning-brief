name: 모닝 브리핑

# 정시 트리거는 외부 스케줄러(cron-job.org)가 workflow_dispatch 로 깨운다.
# GitHub 자체 schedule 은 몇 시간씩 밀리므로 "외부가 실패했을 때의 백업"으로만 남긴다.
# 같은 날·같은 모드로 이미 발송했으면 캐시 마커를 보고 건너뛰므로 중복은 오지 않는다.
on:
  schedule:
    - cron: '47 20 * * *'
    - cron: '47 23,2,5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto = 지금 KST 시각으로 판단)'
        type: choice
        options: [auto, quick, full]
        default: auto

concurrency:
  group: brief
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      APP_URL: ${{ secrets.APP_URL }}
      EXIM_API_KEY: ${{ secrets.EXIM_API_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: 실행 모드 결정
        id: mode
        run: |
          echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.mode }}" = "auto" ]; then
            # 외부 스케줄러는 mode 를 안 넘긴다 → KST 05~08시면 전체, 그 외엔 지표만
            h=$(date +%H)
            if [ "$h" -ge 5 ] && [ "$h" -le 8 ]; then echo "mode=full" >> "$GITHUB_OUTPUT"; else echo "mode=quick" >> "$GITHUB_OUTPUT"; fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "47 20 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci 가 가끔 출력 없이 멎어 20분 타임아웃까지 가는 일이 있었다.
      # 5분 안에 안 끝나면 캐시를 버리고 한 번 더 시도한다.
      - name: 의존성 설치
        timeout-minutes: 6
        run: |
          set -x
          npm ci --no-audit --no-fund --prefer-offline --fetch-timeout=60000 --fetch-retries=3 && exit 0
          echo "첫 시도 실패 — 캐시 비우고 재시도"
          npm cache clean --force || true
          rm -rf node_modules
          npm ci --no-audit --no-fund --fetch-timeout=60000 --fetch-retries=3

      # DART 재무는 주 1회만 바뀌므로 캐시. 없으면 스크리너가 알아서 다시 받음
      - name: DART 캐시 복원
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache@v4
        with:
          path: data
          key: dart-${{ github.run_id }}
          restore-keys: dart-

      - name: 거시지표 수집
        run: node src/macro/index.mjs

      - name: 종목 스크리너
        if: steps.mode.outputs.mode == 'full'
        run: node src/screener/index.mjs
        continue-on-error: true

      # 텔레그램을 먼저 — Pages 배포는 동시 실행 시 취소될 수 있는데,
      # 그때도 브리핑은 이미 나간 상태가 되도록 순서를 이렇게 둔다
      # 같은 날·같은 모드로 이미 보냈는지 표시하는 마커. 외부 스케줄러와 GitHub schedule 이
      # 둘 다 돌아도 메시지는 한 번만 간다.
      - name: 발송 기록 확인
        id: sent
        uses: actions/cache@v4
        with:
          path: .sent
          key: sent-${{ steps.mode.outputs.date }}-${{ steps.mode.outputs.mode }}

      - name: 텔레그램 발송
        if: steps.sent.outputs.cache-hit != 'true'
        run: |
          node src/telegram.mjs ${{ steps.mode.outputs.mode }}
          mkdir -p .sent && date > .sent/ok

      - name: 발송 건너뜀 안내
        if: steps.sent.outputs.cache-hit == 'true'
        run: echo "이미 ${{ steps.mode.outputs.date }} ${{ steps.mode.outputs.mode }} 로 발송함 — 중복 방지로 건너뜀"

      # 핸드폰 페이지를 GitHub Pages 로 게시 — PC·앱 없이 항상 최신
      - name: 페이지 빌드
        run: node src/app/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/app
      - name: 페이지 배포
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 실패 시 알림
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ 모닝 브리핑 실패 (${{ steps.mode.outputs.mode }}) — GitHub Actions 로그를 확인하세요: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
